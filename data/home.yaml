libraries:
  title: "Background Transition Options"
  intro: "The page ships with a lightweight vanilla JavaScript crossfade so Hugo stays simple. If you want more advanced blending later, these libraries are good fits:"
  options:
    - name: "GSAP"
      text: "Best for precise timelines, easing, and controlled opacity or filter transitions."
    - name: "Three.js"
      text: "Best for shader-based gradient morphing and WebGL texture blending."
    - name: "PixiJS"
      text: "Good middle ground for GPU-accelerated sprite and displacement transitions."
    - name: "anime.js"
      text: "Small and friendly for DOM-based opacity, scale, and color animations."
