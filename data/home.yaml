press:
  details:
    - label: "Platform"
      value: "iPhone and iPad"
    - label: "Status"
      value: "Preparing for Apple App Store release"
    - label: "Audience"
      value: "Players, students, researchers, and curious game makers"

how:
  title: "How It Works"
  items:
    - title: "Onboarding"
      image: "samples/sample1.png"
      text: "When you arrive in the app, after a brief introduction to the **Pause** feature (2-finger  vertical swipe), you get to the gamepack screen. You can always pause the app when in game mode by doing a 2-finger swipe down the screen. This will take you out of an active game back to the design interface."
    - title: "Controls"
      image: "samples/pack-screen.png"
      text: "In study mode, you only have the study pack available that shows you the *four* selected starting points you can play and alter. **Tap** on one to get to the game, for example __Keepy  Uppy__."
    - title: "Design Interface"
      image: "samples/sample2-design.png"
      text: "Either when Pausing a game or when picking a game from a game pack, you will end up at the design interface for the game. Game rules are exposed as readable visual parameters. Players can adjust values, toggle mechanics, and compare variations without leaving the app. Game rules are split into a 3x3 grid. If you tap on **STUDY PACK** you will go back and see all games within a game pack and leave the design screen."
    - title: "In Game"
      image: "samples/sample2-ingame.png"
      text: "During a game you will see the score, the remaining lives and the time at the top edge of the screen. When pausing with the 2+finger swipe the design interface will come back. If no change is made the game will continue but if there is a change, the game will restart."
    - title: "Reflect and Share"
      image: "samples/sample2-rating.png"
      text: "The study asks participants to share how they rank certain aspects of the game they played, which could be either a game they designed or changed or already existing. This is crucial for the research to understand the design space."

credits:
  items:
