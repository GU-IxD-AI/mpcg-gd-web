{{ define "main" }}
  {{ $contact := site.Data.contact }}
  <section class="section-panel page-hero">
    <p class="eyebrow">Contact</p>
    <h1>{{ .Title }}</h1>
    <div class="markdown-content lead-content">{{ .Content }}</div>
    <a class="button" href="mailto:{{ $contact.email }}">{{ $contact.emailLabel }}: {{ $contact.email }}</a>
  </section>
  <section class="contact-grid">
    {{ range $contact.sections }}
      <article class="section-panel contact-card">
        <h2>{{ .title }}</h2>
        <p>{{ .text }}</p>
      </article>
    {{ end }}
  </section>
{{ end }}
