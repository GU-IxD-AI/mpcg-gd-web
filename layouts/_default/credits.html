{{ define "main" }}
  {{ $home := site.Data.home }}
  <section class="section-panel page-hero">
    <p class="eyebrow">Acknowledgements</p>
    <h1>{{ .Title }}</h1>
    <div class="markdown-content lead-content">{{ .Content }}</div>
  </section>
  <section class="contact-grid credits-grid">
    {{ range $home.credits.items }}
      <article class="section-panel contact-card">
        <h2>{{ .title }}</h2>
        <div class="markdown-content">{{ .text | markdownify }}</div>
      </article>
    {{ end }}
  </section>
{{ end }}
